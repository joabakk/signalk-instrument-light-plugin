# Signal K plugin CI: runs the tests on Linux (x64 and arm64), macOS and
# Windows with Node 22 and 24, using the reusable workflow from
# SignalK/signalk-server. The results show in the App Store's Indicators tab.

name: SignalK Plugin CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  test-plugin:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      test-command: npm test
      build-command: npm run build --if-present
      node-versions: '["22", "24"]'
